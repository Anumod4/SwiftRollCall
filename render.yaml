services:
  - type: web
    name: swiftrollcall
    env: node
    # Build everything in one go
    buildCommand: npm install && npm run build && cd mobile && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

