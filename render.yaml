services:
  - type: web
    name: swiftrollcall
    env: node
    # Build everything in one go
    buildCommand: npm install && npm run build && cd mobile && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

  - type: static
    name: swiftrollcall-parent
    env: static
    buildCommand: cd mobile && npm install && npx expo export --platform web
    publishDir: mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html


